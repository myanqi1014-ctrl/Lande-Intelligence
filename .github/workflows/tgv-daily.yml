name: TGV 技术情报每日更新
on:
  schedule:
    # 06:00 Asia/Shanghai = 22:00 UTC on the previous day
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-tgv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect TGV intelligence
        run: python tgv/fetch_news.py
      - name: Commit updated TGV news archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tgv/news.json
          if ! git diff --cached --quiet; then
            git commit -m "自动更新 TGV 技术情报"
            git push
          fi
